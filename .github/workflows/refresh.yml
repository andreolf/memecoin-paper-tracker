name: Refresh Paper-Trading Dashboard

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
  push:
    paths:
      - 'data/alerts.csv'

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run refresh script
        run: |
          python scripts/refresh.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calls.csv README.md dashboard/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update paper-trading dashboard [skip ci]"
            
            # Pull with rebase and retry logic
            max_retries=3
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              git pull --rebase origin ${{ github.ref_name }} && break || {
                retry_count=$((retry_count + 1))
                if [ $retry_count -lt $max_retries ]; then
                  echo "Pull failed, retrying ($retry_count/$max_retries)..."
                  sleep 2
                else
                  echo "Pull failed after $max_retries attempts"
                  exit 1
                fi
              }
            done
            
            # Push with retry logic
            retry_count=0
            while [ $retry_count -lt $max_retries ]; do
              git push && break || {
                retry_count=$((retry_count + 1))
                if [ $retry_count -lt $max_retries ]; then
                  echo "Push failed, retrying ($retry_count/$max_retries)..."
                  sleep 2
                else
                  echo "Push failed after $max_retries attempts"
                  exit 1
                fi
              }
            done
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
